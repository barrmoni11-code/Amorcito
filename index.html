<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un detalle para ti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --papiro-bg: #f2e3c9;
            --rose-deep: #880e4f;
            --accent: #d4a373;
            --gold: #c5a059;
            --storm-blue: #2c3e50;
        }

        body {
            background-color: #0f0f0f;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            font-family: 'Lora', serif;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #selection-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.8s ease;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            width: 100%;
            max-width: 900px;
            margin-top: 30px;
        }

        .gift-card {
            position: relative;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .gift-card:hover {
            transform: scale(1.05) translateY(-10px);
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--gold);
        }

        .gift-img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
            margin-bottom: 15px;
        }

        .tag {
            font-family: 'Dancing Script', cursive;
            color: var(--gold);
            font-size: 1.5rem;
            margin-top: 10px;
        }

        #letter-view {
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
            width: 90%;
            max-width: 750px;
            margin: 40px auto;
        }

        .papyrus {
            background-color: var(--papiro-bg);
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            padding: 5rem 3.5rem;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            border: 1px solid #8d6e63;
            position: relative;
            border-radius: 4px;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #5d4037;
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .letter-content p {
            color: #3e2723;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            text-align: justify;
            font-size: 1.2rem;
        }

        .highlight {
            color: var(--rose-deep);
            font-weight: 700;
            font-style: italic;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            text-align: right;
            margin-top: 3rem;
            color: #5d4037;
        }

        .particle {
            position: fixed;
            top: -10%;
            pointer-events: none;
            z-index: 100;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 640px) {
            .papyrus { padding: 3rem 1.5rem; }
            .title { font-size: 2.5rem; }
            .letter-content p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div id="selection-view">
        <h2 class="text-white text-3xl font-light tracking-widest mb-10 text-center opacity-80 uppercase">Elige un sentimiento mi amorcito</h2>
        
        <div class="gallery-container">
            <!-- Opción 1: Ramo Original -->
            <div class="gift-card" onclick="openLetter('amor')">
                <img src="https://png.pngtree.com/png-vector/20250127/ourmid/pngtree-flower-bouquet-transparent-png-image_15345222.png" 
                     alt="Ramo de flores" class="gift-img">
                <div class="tag">Para mis días de luz ❤️</div>
            </div>

            <!-- Opción 2: Nubes y Tormenta -->
            <div class="gift-card" onclick="openLetter('tormenta')">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/047/830/713/small_2x/dynamic-illustration-of-a-lightning-storm-within-a-dense-cloud-formation-showcasing-powerful-weather-elements-png.png" 
                     alt="Nubes y Tormenta" class="gift-img">
                <div class="tag">En nuestras tormentas ⛈️</div>
            </div>
        </div>
        
        <p class="mt-16 text-stone-500 text-xs tracking-widest animate-pulse uppercase">Selecciona una imagen para abrir</p>
    </div>

    <div id="letter-view">
        <article class="papyrus">
            <h1 id="letter-title" class="title">Título de la Carta</h1>
            
            <div id="letter-body" class="letter-content">
                <!-- El contenido se inyectará dinámicamente -->
            </div>
            
            <div id="letter-signature" class="signature">Firma</div>
        </article>
        
        <button onclick="closeLetter()" class="mt-12 block mx-auto text-stone-500 hover:text-stone-300 text-xs tracking-[0.3em] uppercase transition-colors pb-10">Volver a la selección</button>
    </div>

    <script>
        const content = {
            'amor': {
                title: '¡Felices 7 Meses!',
                particles: ['🌸', '✨', '🌹', '🤍', '🌷', '💖'],
                body: `
                    <p>Para mi lugar favorito,</p>
                    <p>Desde que estás en mi vida, cada día tiene un nuevo brillo, un nuevo color. No puedo imaginar mi mundo sin tu risa, tu paz y tu luz. Eres la razón por la que mi corazón se siente completo.</p>
                    <p>Contigo aprendí que el amor no siempre necesita fuegos artificiales; a veces solo necesita una persona que te haga sentir paz incluso en los días difíciles. Y tú eres eso para mí: <span class="highlight">mi tranquilidad, mi refugio, mi lugar favorito en el mundo.</span></p>
                    <p>Porque tú no eres solo alguien que amo. Eres la persona con la que mi alma se siente en casa. Entre millones de personas en el mundo, mi corazón te eligió a ti… y volvería a hacerlo una y mil veces más.</p>
                `,
                signature: 'Te amo con todo mi ser ❤️'
            },
            'tormenta': {
                title: 'En la Calma y en la Tormenta',
                particles: ['⛈️', '💧', '⚡', '☁️', '💙', '🌈'],
                body: `
                    <p>Amor mío,</p>
                    <p>Te escribo esta carta desde lo más profundo de mi corazón, con la necesidad de recordarte algo que jamás deberías dudar.</p>
                    <p>Sé que a veces los días se vuelven difíciles. Sé que chocamos, que nos enojamos y que nuestras imperfecciones nos hacen discutir. En esos momentos, el ambiente se vuelve pesado y el silencio duele. Pero quiero que me mires, que me leas con el alma, y que recuerdes esto: <span class="highlight">ni la peor de nuestras discusiones va a cambiar un solo milímetro lo que siento por ti.</span></p>
                    <p>Mi amor por ti no es un sentimiento pasajero que depende de que todo sea perfecto o de que siempre estemos de acuerdo. Te amo con tus luces y con tus sombras, te amo cuando nos reímos a carcajadas y te amo también cuando nos cuesta entendernos. El enojo es solo un momento, una nube que pasa, pero <span class="highlight">tú eres mi cielo entero.</span></p>
                    <p>Cuando discutimos, mi mundo no se desarma; al contrario, me dan más ganas de abrazarte fuerte, de pedirte perdón o de perdonarte, y de recordarte que somos un equipo. No le temo a nuestras tormentas porque sé perfectamente con quién quiero ver salir el sol cada mañana.</p>
                    <p>Quiero que sientas la absoluta paz de que, pase lo que pase, yo no me voy a ir. Mi compromiso contigo es inquebrantable y mi amor es eterno. Estar contigo es la decisión más hermosa y firme que he tomado en mi vida, y nada en este mundo va a cambiar eso.</p>
                    <p>Te amo en la calma, te amo en la tormenta, hoy, mañana y para siempre.</p>
                `,
                signature: 'Tu amor eterno ❤️'
            }
        };

        let particleInterval;

        function createParticle(icons) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            p.style.left = Math.random() * 100 + 'vw';
            p.style.fontSize = (Math.random() * 25 + 15) + 'px';
            p.style.animationDuration = (Math.random() * 3 + 4) + 's';
            p.style.opacity = Math.random() * 0.7 + 0.3;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 6000);
        }

        function openLetter(type) {
            const data = content[type];
            const sView = document.getElementById('selection-view');
            const lView = document.getElementById('letter-view');
            
            // Inyectar contenido
            document.getElementById('letter-title').innerText = data.title;
            document.getElementById('letter-body').innerHTML = data.body;
            document.getElementById('letter-signature').innerText = data.signature;

            // Transición de salida
            sView.style.opacity = '0';
            sView.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                sView.style.display = 'none';
                lView.style.display = 'block';
                
                // Forzar reflujo
                lView.offsetHeight; 
                
                lView.style.opacity = '1';
                lView.style.transform = 'translateY(0)';
                
                // Iniciar partículas temáticas
                clearInterval(particleInterval);
                for(let i=0; i<10; i++) setTimeout(() => createParticle(data.particles), i * 150);
                particleInterval = setInterval(() => createParticle(data.particles), 500);
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 800);
        }

        function closeLetter() {
            const sView = document.getElementById('selection-view');
            const lView = document.getElementById('letter-view');
            
            lView.style.opacity = '0';
            lView.style.transform = 'translateY(30px)';
            
            clearInterval(particleInterval);
            
            setTimeout(() => {
                lView.style.display = 'none';
                sView.style.display = 'flex';
                
                sView.offsetHeight;
                
                sView.style.opacity = '1';
                sView.style.transform = 'scale(1)';
            }, 800);
        }

        // Efecto inicial sutil
        window.onload = () => {
            const initialIcons = ['✨', '🤍'];
            for(let i=0; i<6; i++) {
                setTimeout(() => createParticle(initialIcons), Math.random() * 2000);
            }
        };
    </script>
</body>
</html>
